<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFind | Lost & Found(CM25005)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-800">

<!-- NAVBAR -->
<nav class="bg-white border-b sticky top-0 z-40">
  <div class="max-w-6xl mx-auto px-5 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 text-white p-2 rounded-xl">🔎</div>
      <div>
        <h1 class="font-bold text-xl">CampusFind</h1>
        <p class="text-xs text-gray-500">Lost & Found</p>
      </div>
    </div>

    <button onclick="openForm()"
      class="bg-indigo-600 text-white px-4 py-2 rounded-xl">
      + Report
    </button>
  </div>
</nav>


<!-- HERO -->
<section class="bg-gradient-to-r from-indigo-700 to-violet-700 text-white">
  <div class="max-w-6xl mx-auto px-5 py-12 grid md:grid-cols-2 gap-8 items-center">

    <div>
      <span class="bg-white/20 px-4 py-2 rounded-full text-sm">
        🎓 Campus Community
      </span>

      <h2 class="text-4xl font-bold mt-5">
        Lost something?<br>
        <span class="text-indigo-200">Let's find it.</span>
      </h2>

      <p class="text-indigo-100 mt-4">
        Report lost items, share found belongings and
        reconnect with your campus community.
      </p>

      <button onclick="openForm()"
        class="mt-6 bg-white text-indigo-700 px-6 py-3
               rounded-xl font-bold">
        Report an Item →
      </button>
    </div>

    <div class="hidden md:block">
      <img
        src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=900&q=80"
        class="rounded-3xl h-64 w-full object-cover shadow-2xl">
    </div>

  </div>
</section>


<!-- MAIN -->
<main class="max-w-6xl mx-auto px-5 py-8">

  <!-- STATS -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

    <div class="bg-white p-5 rounded-2xl shadow-sm">
      <p class="text-gray-500 text-sm">Total Reports</p>
      <b id="total" class="text-3xl">0</b>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm">
      <p class="text-gray-500 text-sm">Lost</p>
      <b id="lost" class="text-3xl text-red-500">0</b>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm">
      <p class="text-gray-500 text-sm">Found</p>
      <b id="found" class="text-3xl text-green-500">0</b>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm">
      <p class="text-gray-500 text-sm">Matched</p>
      <b id="matched" class="text-3xl text-indigo-600">0</b>
    </div>

  </div>


  <!-- SEARCH -->
  <div class="bg-white p-4 rounded-2xl shadow-sm mt-7">

    <div class="flex flex-col md:flex-row gap-3">

      <input id="search" oninput="showItems()"
        placeholder="🔍 Search item or location..."
        class="flex-1 border rounded-xl p-3">

      <select id="filter" onchange="showItems()"
        class="border rounded-xl p-3">
        <option>All</option>
        <option>Lost</option>
        <option>Found</option>
      </select>

    </div>

  </div>


  <!-- REPORTS -->
  <div class="mt-8">
    <h2 class="text-2xl font-bold">Recent Reports</h2>
    <p class="text-gray-500 text-sm">
      Browse items reported by students.
    </p>
  </div>

  <div id="items"
    class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-5">
  </div>

</main>


<!-- MODAL -->
<div id="modal"
  class="hidden fixed inset-0 bg-black/50 z-50
         flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-lg rounded-2xl p-6">

    <div class="flex justify-between">
      <h2 class="text-2xl font-bold">Report Item</h2>

      <button onclick="closeForm()">✕</button>
    </div>


    <!-- IMAGE PREVIEW -->
    <div class="mt-4">

      <label class="block border-2 border-dashed border-gray-300
                    rounded-xl p-5 text-center cursor-pointer">

        <img id="preview"
          class="hidden w-full h-40 object-cover rounded-lg mb-3">

        <span id="uploadText">
          📷 Click to upload item image
        </span>

        <input id="photo"
          type="file"
          accept="image/*"
          onchange="previewImage()"
          class="hidden">

      </label>

    </div>


    <!-- FORM -->
    <div class="space-y-3 mt-4">

      <input id="name"
        placeholder="Item name"
        class="w-full border rounded-xl p-3">

      <input id="place"
        placeholder="Where was it lost/found?"
        class="w-full border rounded-xl p-3">

      <div class="grid grid-cols-2 gap-3">

        <select id="type" class="border rounded-xl p-3">
          <option>Lost</option>
          <option>Found</option>
        </select>

        <select id="category" class="border rounded-xl p-3">
          <option>ID Card</option>
          <option>Electronics</option>
          <option>Stationery</option>
          <option>Accessories</option>
          <option>Other</option>
        </select>

      </div>

      <textarea id="description"
        placeholder="Short description"
        class="w-full border rounded-xl p-3"></textarea>

      <button onclick="addItem()"
        class="w-full bg-indigo-600 text-white p-3
               rounded-xl font-bold">
        Publish Report
      </button>

    </div>

  </div>
</div>


<script>

let items = JSON.parse(localStorage.getItem("campusFind")) || [];
let imageData = "";


/* IMAGE PREVIEW */

function previewImage() {

  let file = document.getElementById("photo").files[0];

  if (!file) return;

  let reader = new FileReader();

  reader.onload = function(e) {
    imageData = e.target.result;

    document.getElementById("preview").src = imageData;
    document.getElementById("preview").classList.remove("hidden");
    document.getElementById("uploadText").classList.add("hidden");
  };

  reader.readAsDataURL(file);
}


/* ADD ITEM */

function addItem() {

  let name = document.getElementById("name").value;
  let place = document.getElementById("place").value;

  if (!name || !place) {
    alert("Please enter item name and location");
    return;
  }

  items.unshift({
    name: name,
    place: place,
    type: document.getElementById("type").value,
    category: document.getElementById("category").value,
    description: document.getElementById("description").value,
    image: imageData,
    matched: false
  });

  save();
  showItems();
  closeForm();
  clearForm();
}


/* DISPLAY */

function showItems() {

  let box = document.getElementById("items");
  let search = document.getElementById("search").value.toLowerCase();
  let filter = document.getElementById("filter").value;

  box.innerHTML = "";

  items.forEach((item, i) => {

    let text = (item.name + " " + item.place).toLowerCase();

    if (!text.includes(search)) return;
    if (filter != "All" && item.type != filter) return;

    box.innerHTML += `

      <div class="bg-white rounded-2xl overflow-hidden shadow-sm
                  border hover:shadow-lg transition">

        <img src="${item.image || 
          'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=600&q=80'}"
          class="w-full h-44 object-cover">

        <div class="p-5">

          <div class="flex justify-between gap-2">

            <h3 class="font-bold text-lg">${item.name}</h3>

            <span class="text-xs font-bold px-3 py-1 rounded-full
              ${item.type == "Lost"
              ? "bg-red-100 text-red-600"
              : "bg-green-100 text-green-600"}">

              ${item.type}

            </span>

          </div>

          <p class="text-gray-500 text-sm mt-2">
            📍 ${item.place}
          </p>

          <p class="text-gray-400 text-sm mt-1">
            ${item.category}
          </p>

          <p class="text-sm mt-3">
            ${item.description || "No description provided."}
          </p>

          <div class="flex gap-2 mt-4">

            <button onclick="matchItem(${i})"
              class="flex-1 bg-indigo-600 text-white
                     py-2 rounded-lg">

              ${item.matched ? "✓ Matched" : "Mark Matched"}

            </button>

            <button onclick="deleteItem(${i})"
              class="bg-slate-100 px-4 rounded-lg">

              🗑

            </button>

          </div>

        </div>

      </div>
    `;
  });

  updateStats();
}


/* MATCH */

function matchItem(i) {
  items[i].matched = true;
  save();
  showItems();
}


/* DELETE */

function deleteItem(i) {
  items.splice(i, 1);
  save();
  showItems();
}


/* STATISTICS */

function updateStats() {

  document.getElementById("total").innerText = items.length;

  document.getElementById("lost").innerText =
    items.filter(x => x.type == "Lost").length;

  document.getElementById("found").innerText =
    items.filter(x => x.type == "Found").length;

  document.getElementById("matched").innerText =
    items.filter(x => x.matched).length;
}


/* STORAGE */

function save() {
  localStorage.setItem("campusFind", JSON.stringify(items));
}


/* MODAL */

function openForm() {
  document.getElementById("modal").classList.remove("hidden");
}

function closeForm() {
  document.getElementById("modal").classList.add("hidden");
}


/* RESET FORM */

function clearForm() {

  document.getElementById("name").value = "";
  document.getElementById("place").value = "";
  document.getElementById("description").value = "";
  document.getElementById("photo").value = "";

  document.getElementById("preview").classList.add("hidden");
  document.getElementById("uploadText").classList.remove("hidden");

  imageData = "";
}


showItems();

</script>

</body>
</html>
